version: '3.8'

services:
  usbridge:
    build: .
    container_name: usbridge
    privileged: true
    network_mode: "host"
    restart: unless-stopped
    volumes:
      - /dev:/dev
      - /sys:/sys
      - /lib/modules:/lib/modules:ro
      - ./config.json:/app/config.json
      - ./usbridge.log:/app/usbridge.log
